<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信を停止しました — VoiPoke</title>
<meta name="robots" content="noindex">
<style>
  :root { --mint:#41d98c; --bg-top:#0a1714; --bg-bottom:#03100c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh;
    background:linear-gradient(160deg,var(--bg-top),var(--bg-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap { max-width:440px; width:100%; text-align:center; }
  .logo { font-size:22px; font-weight:700; color:var(--mint); letter-spacing:.02em; margin-bottom:8px; }
  .tagline { font-size:11px; color:rgba(255,255,255,.45); margin-bottom:32px; }
  .card {
    background:#0f2019; border:1px solid rgba(65,217,140,.12);
    border-radius:18px; padding:36px 28px;
  }
  .check {
    width:56px; height:56px; margin:0 auto 20px;
    border-radius:50%; background:rgba(65,217,140,.12);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; color:var(--mint);
  }
  h1 { font-size:19px; font-weight:700; color:#fff; margin-bottom:14px; }
  p { font-size:14px; line-height:1.85; color:rgba(255,255,255,.68); margin-bottom:24px; }
  .btn {
    display:inline-block; background:var(--mint); color:#04110c;
    text-decoration:none; font-weight:700; font-size:14px;
    padding:12px 26px; border-radius:12px;
  }
  .foot { margin-top:24px; font-size:11px; color:rgba(255,255,255,.35); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">VoiPoke</div>
    <div class="tagline">触れるシチュエーションボイス</div>
    <div class="card">
      <div class="check">&#10003;</div>
      <h1>配信を停止しました</h1>
      <p>VoiPoke からのメール配信を停止しました。<br>また気が向いたら、いつでも登録できます。</p>
      <a class="btn" href="https://voipoke-lp.reverb-lab.com/">VoiPoke を見る</a>
    </div>
    <div class="foot">VoiPoke 開発 / Reverb Lab</div>
  </div>
</body>
</html>
