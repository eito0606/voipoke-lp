<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>VoiPoke OGP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      /* OGP card：1200×630 固定。ヒーローを切り抜いた強い1枚に */
      :root {
        --c-bg: #070b08;
        --c-mint: #3fe0a0;
        --c-mint-soft: #84efb6;
        --c-mint-glow: rgba(63, 224, 160, 0.45);
        --c-ink: #f0faf3;
        --c-ink-2: rgba(240, 250, 243, 0.72);
        --c-border: rgba(132, 239, 182, 0.18);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1200px; height: 630px;
        overflow: hidden;
        background: var(--c-bg);
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        color: var(--c-ink);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'palt' 1;
      }

      /* 背景レイヤー */
      .bg-mesh, .bg-grid, .bg-noise, .bg-vignette {
        position: absolute; inset: 0; pointer-events: none;
      }
      .bg-mesh {
        background:
          radial-gradient(ellipse 60% 70% at 75% 50%, rgba(26, 77, 46, 0.6), transparent 60%),
          radial-gradient(ellipse 50% 40% at 100% 50%, rgba(63, 224, 160, 0.16), transparent 60%),
          radial-gradient(ellipse 80% 50% at 0% 100%, rgba(13, 53, 32, 0.5), transparent 70%);
      }
      .bg-grid {
        background-image:
          linear-gradient(rgba(132, 239, 182, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(132, 239, 182, 0.06) 1px, transparent 1px);
        background-size: 80px 80px;
        background-position: -1px -1px;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 90%);
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, black 30%, transparent 90%);
      }
      .bg-noise {
        background-image: url('/noise.svg');
        background-size: 220px 220px;
        opacity: 0.6;
        mix-blend-mode: overlay;
      }
      .bg-vignette {
        background:
          radial-gradient(ellipse 100% 50% at 0% 0%, rgba(0, 0, 0, 0.4), transparent 60%),
          radial-gradient(ellipse 100% 50% at 100% 100%, rgba(0, 0, 0, 0.5), transparent 60%);
      }

      .stage {
        position: relative;
        width: 100%; height: 100%;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        padding: 64px 80px;
        z-index: 1;
      }

      /* 左：テキスト */
      .left {
        display: flex; flex-direction: column;
        gap: 24px;
        position: relative; z-index: 2;
      }

      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px; font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--c-mint);
      }
      .eyebrow::before {
        content: ''; display: inline-block;
        width: 36px; height: 1px;
        background: var(--c-mint);
        box-shadow: 0 0 6px var(--c-mint-glow);
      }

      .headline {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 92px; font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      .headline .accent {
        background: linear-gradient(110deg, var(--c-mint) 30%, var(--c-mint-soft) 60%, #fff 75%, var(--c-mint-soft));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      .meta {
        display: inline-flex; align-items: center; gap: 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px; font-weight: 700;
        color: var(--c-ink-2);
        letter-spacing: 0.12em;
        margin-top: 8px;
      }
      .meta .dot {
        display: inline-block;
        width: 8px; height: 8px;
        background: var(--c-mint);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--c-mint-glow);
      }

      /* 右：オーブ */
      .right {
        position: relative;
        display: grid; place-items: center;
        height: 100%;
      }
      .orb-stage {
        position: relative;
        width: 380px; height: 380px;
        display: grid; place-items: center;
      }
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid var(--c-border);
      }
      .ring-1 { width: 100%; height: 100%; }
      .ring-2 { width: 72%; height: 72%; border-color: rgba(132, 239, 182, 0.28); }
      .ring-3 { width: 44%; height: 44%; border-color: rgba(132, 239, 182, 0.36); }

      .orb {
        position: relative;
        width: 36%; aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%,
          #ffffff 0%,
          var(--c-mint-soft) 22%,
          var(--c-mint) 55%,
          #1a4d2e 92%);
        box-shadow:
          inset -6px -10px 28px rgba(7, 11, 8, 0.65),
          inset 4px 4px 18px rgba(255, 255, 255, 0.18),
          0 0 80px rgba(63, 224, 160, 0.45);
      }

      /* フッター左下：ロゴ */
      .logo {
        position: absolute;
        left: 80px; bottom: 56px;
        display: inline-flex; align-items: center; gap: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 22px; font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--c-ink);
        z-index: 3;
      }
      .logo-mark {
        color: var(--c-mint);
        filter: drop-shadow(0 0 8px var(--c-mint-glow));
        font-size: 24px;
      }

      /* フッター右下：ハッシュ風タグ */
      .footer-tag {
        position: absolute;
        right: 80px; bottom: 56px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 500;
        letter-spacing: 0.16em;
        color: rgba(240, 250, 243, 0.4);
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
    <div class="bg-vignette"></div>

    <div class="stage">
      <div class="left">
        <span class="eyebrow">擬似ASMR ／ 3Dオーディオ</span>
        <h1 class="headline">
          あなたの声を、<br />
          <span class="accent">どこに置く？</span>
        </h1>
        <span class="meta">
          <span class="dot"></span>
          2026.06.30 ／ App Store
        </span>
      </div>

      <div class="right">
        <div class="orb-stage">
          <span class="ring ring-1"></span>
          <span class="ring ring-2"></span>
          <span class="ring ring-3"></span>
          <div class="orb"></div>
        </div>
      </div>
    </div>

    <div class="logo">
      <span class="logo-mark">◉</span>
      <span>VoiPoke</span>
    </div>
    <div class="footer-tag">voipoke-lp.reverb-lab.com</div>
  </body>
</html>
